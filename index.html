<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner PWA</title>
    <link rel="icon" type="image/png" href="icon/icon-192.png">
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        
        /* Toggle Switch Styling */
        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #94a3b8; transition: .3s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Mode Instructions / Inputs */
        .mode-panel { display: none; margin-bottom: 20px; }
        .mode-panel.active { display: block; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .global-box {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            color: #64748b;
            background: #fafafa;
        }

        /* Scan Log */
        .log-container {
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }
        .log-list li {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 1rem;
        }
        .log-list li:last-child { border-bottom: none; }
        .timestamp { color: #94a3b8; font-size: 0.85rem; }
        button.clear-btn {
            background: #ef4444; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }
        button.clear-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Barcode Scanner Hub</h2>

        <!-- Toggle Switch for Modes -->
        <div class="controls-section">
            <div>
                <strong>Mode:</strong> <span id="modeLabel">Readonly Input Box</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="modeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Option 1 Panel: Readonly Field -->
        <div id="panelInput" class="mode-panel active">
            <label style="display:block; margin-bottom:6px; font-size:0.9rem; color:#64748b;">Active Input Buffer (No Keyboard):</label>
            <input type="text" id="barcodeInput" readonly placeholder="Scan code here...">
        </div>

        <!-- Option 2 Panel: Global Document Listener -->
        <div id="panelGlobal" class="mode-panel">
            <div class="global-box">
                🌍 Global Listener Active<br>
                <small>Scan anywhere on the page</small>
            </div>
        </div>

        <!-- Scan History Log -->
        <div class="log-container">
            <div class="log-header">
                <strong>Scan History</strong>
                <button class="clear-btn" id="clearLog">Clear Log</button>
            </div>
            <ul class="log-list" id="scanLog">
                <li style="color: #94a3b8; justify-content: center;">No scans recorded yet</li>
            </ul>
        </div>
    </div>

    <script>
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabel');
        const panelInput = document.getElementById('panelInput');
        const panelGlobal = document.getElementById('panelGlobal');
        
        const barcodeInput = document.getElementById('barcodeInput');
        const scanLog = document.getElementById('scanLog');
        const clearLogBtn = document.getElementById('clearLog');

        let isGlobalMode = false;
        let barcodeBuffer = '';
        let lastKeyTime = Date.now();

        // Focus management for Option 1
        function maintainFocus() {
            if (!isGlobalMode) {
                barcodeInput.focus();
            }
        }

        window.onload = maintainFocus;
        document.addEventListener('click', maintainFocus);

        // Toggle Switch Event
        modeToggle.addEventListener('change', (e) => {
            isGlobalMode = e.target.checked;
            if (isGlobalMode) {
                modeLabel.innerText = "Global Document Listener";
                panelInput.classList.remove('active');
                panelGlobal.classList.add('active');
                barcodeBuffer = '';
            } else {
                modeLabel.innerText = "Readonly Input Box";
                panelGlobal.classList.remove('active');
                panelInput.classList.add('active');
                maintainFocus();
            }
        });

        // Add scan to visible history log
        function logScan(code) {
            if (scanLog.children.length === 1 && scanLog.children[0].style.color) {
                scanLog.innerHTML = ''; // Remove "No scans" placeholder
            }

            const timeString = new Date().toLocaleTimeString();
            const li = document.createElement('li');
            li.innerHTML = `<span>${code}</span> <span class="timestamp">${timeString}</span>`;
            scanLog.prepend(li); // Newest scans at the top
        }

        // Option 1 Logic: Readonly Input Keydown
        barcodeInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const val = barcodeInput.value.trim();
                if (val) {
                    logScan(val);
                    barcodeInput.value = '';
                }
            }
        });

        // Option 2 Logic: Global Document Keydown
        document.addEventListener('keydown', (event) => {
            if (!isGlobalMode) return;

            // Ignore modifier keys or functional keys
            if (event.key === 'Shift' || event.key === 'Control' || event.key === 'Alt' || event.key === 'Meta') return;

            const currentTime = Date.now();
            // Reset buffer if typing speed is too slow (human typing)
            if (currentTime - lastKeyTime > 100) {
                barcodeBuffer = '';
            }
            lastKeyTime = currentTime;

            if (event.key === 'Enter') {
                if (barcodeBuffer.length > 0) {
                    logScan(barcodeBuffer);
                    barcodeBuffer = '';
                }
            } else if (event.key.length === 1) {
                barcodeBuffer += event.key;
            }
        });

        // Clear Log
        clearLogBtn.addEventListener('click', () => {
            scanLog.innerHTML = '<li style="color: #94a3b8; justify-content: center;">No scans recorded yet</li>';
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>
</body>
</html>
