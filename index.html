<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner PWA</title>
    <link rel="icon" type="image/png" href="icon/icon-192.png">
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --bg: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #dbeafe;
            --success-bg: #ecfdf5;
            --success-border: #bbf7d0;
            --success-text: #166534;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: -0.03em;
        }
        
        /* Toggle Switch Styling */
        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #94a3b8; transition: .3s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Mode Instructions / Inputs */
        .mode-panel { display: none; margin-bottom: 20px; }
        .mode-panel.active { display: block; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .global-box {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            color: #64748b;
            background: #fafafa;
        }

        /* Scan Log */
        .status-box {
            margin-bottom: 16px;
            padding: 14px 16px;
            background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            color: #1e3a8a;
        }
        .status-box strong {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #lastScanValue {
            font-size: 1.2rem;
            font-weight: 700;
            word-break: break-all;
            margin-bottom: 6px;
        }
        #lastScanType {
            display: block;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .log-container {
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }
        .log-list li {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-family: monospace;
            font-size: 0.98rem;
        }
        .log-list li:last-child { border-bottom: none; }
        .log-list li strong {
            display: block;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .log-list li small {
            color: var(--muted);
            display: block;
            margin-top: 3px;
        }
        .timestamp { color: #94a3b8; font-size: 0.8rem; text-align: right; }
        button.clear-btn {
            background: #ef4444; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }
        button.clear-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Barcode Scanner Hub</h2>

        <!-- Toggle Switch for Modes -->
        <div class="controls-section">
            <div>
                <strong>Mode:</strong> <span id="modeLabel">Readonly Input Box</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="modeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Option 1 Panel: Readonly Field -->
        <div id="panelInput" class="mode-panel">
            <label style="display:block; margin-bottom:6px; font-size:0.9rem; color:#64748b;">Active Input Buffer (No Keyboard):</label>
            <input type="text" id="barcodeInput" readonly placeholder="Scan code here...">
        </div>

        <!-- Option 2 Panel: Global Document Listener -->
        <div id="panelGlobal" class="mode-panel active">
            <div class="status-box">
                <strong>Last Scan</strong>
                <div id="lastScanValue">Waiting for scan…</div>
                <small id="lastScanType">Code type: Unknown</small>
            </div>
            <div class="global-box">
                🌍 Global Listener Active<br>
                <small>Scan anywhere on the page</small>
            </div>
        </div>

        <!-- Scan History Log -->
        <div class="log-container">
            <div class="log-header">
                <strong>Scan History</strong>
                <button class="clear-btn" id="clearLog">Clear Log</button>
            </div>
            <ul class="log-list" id="scanLog">
                <li style="color: #94a3b8; justify-content: center;">No scans recorded yet</li>
            </ul>
        </div>
    </div>

    <script>
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabel');
        const panelInput = document.getElementById('panelInput');
        const panelGlobal = document.getElementById('panelGlobal');
        
        const barcodeInput = document.getElementById('barcodeInput');
        const scanLog = document.getElementById('scanLog');
        const clearLogBtn = document.getElementById('clearLog');
        const lastScanValue = document.getElementById('lastScanValue');
        const lastScanType = document.getElementById('lastScanType');

        let isGlobalMode = true;
        let barcodeBuffer = '';
        let lastKeyTime = Date.now();

        function detectBarcodeType(code) {
            const trimmed = String(code || '').trim();
            if (!trimmed) return 'Unknown';

            if (/^[0-9]+$/.test(trimmed)) {
                if (trimmed.length === 8) return 'EAN-8';
                if (trimmed.length === 12) return 'UPC-A';
                if (trimmed.length === 13) return 'EAN-13';
                if (trimmed.length === 14) return 'ITF-14';
                return 'Numeric';
            }

            if (/^[A-Z0-9\-.$\/\+%\s]+$/i.test(trimmed)) {
                return 'Code 39';
            }

            if (/^[A-Za-z0-9!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~\s]+$/.test(trimmed)) {
                return 'Code 128';
            }

            if (trimmed.length >= 10 && /[A-Z]/i.test(trimmed) && /[0-9]/.test(trimmed)) {
                return 'QR / 2D Matrix';
            }

            return 'Unknown';
        }

        function updateLastScan(code, type) {
            if (!code) {
                lastScanValue.textContent = 'Waiting for scan…';
                lastScanType.textContent = 'Code type: Unknown';
                return;
            }

            lastScanValue.textContent = code;
            lastScanType.textContent = `Code type: ${type}`;
            barcodeInput.value = code;
        }

        function processScan(code) {
            const cleaned = String(code || '').trim();
            if (!cleaned) return;

            const type = detectBarcodeType(cleaned);
            logScan(cleaned, type);
            updateLastScan(cleaned, type);
            barcodeBuffer = '';
        }

        function logScan(code, type) {
            if (scanLog.children.length === 1 && scanLog.children[0].style.color) {
                scanLog.innerHTML = '';
            }

            const timeString = new Date().toLocaleTimeString();
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${code}</strong><br><small>${type}</small></span> <span class="timestamp">${timeString}</span>`;
            scanLog.prepend(li);
        }

        // Toggle Switch Event
        modeToggle.addEventListener('change', (e) => {
            isGlobalMode = e.target.checked;
            if (isGlobalMode) {
                modeLabel.innerText = "Global Document Listener";
                panelInput.classList.remove('active');
                panelGlobal.classList.add('active');
                barcodeBuffer = '';
            } else {
                modeLabel.innerText = "Readonly Input Box";
                panelGlobal.classList.remove('active');
                panelInput.classList.add('active');
            }
        });

        // Option 1 Logic: Readonly Input Keydown
        barcodeInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const val = barcodeInput.value.trim();
                if (val) {
                    processScan(val);
                    barcodeInput.value = '';
                }
            }
        });

        // Option 2 Logic: Global Document Keydown
        document.addEventListener('keydown', (event) => {
            if (!isGlobalMode) return;

            if (event.key === 'Shift' || event.key === 'Control' || event.key === 'Alt' || event.key === 'Meta') return;
            if (event.ctrlKey || event.altKey || event.metaKey) return;
            if (event.key === 'Tab' || event.key === 'Escape') return;

            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 80) {
                barcodeBuffer = '';
            }
            lastKeyTime = currentTime;

            if (event.key === 'Enter') {
                processScan(barcodeBuffer);
            } else if (event.key.length === 1) {
                barcodeBuffer += event.key;
            }
        });

        clearLogBtn.addEventListener('click', () => {
            scanLog.innerHTML = '<li style="color: #94a3b8; justify-content: center;">No scans recorded yet</li>';
            updateLastScan('', 'Unknown');
            barcodeBuffer = '';
        });

        modeToggle.checked = true;
        modeToggle.dispatchEvent(new Event('change'));

        // Clear Log
        clearLogBtn.addEventListener('click', () => {
            scanLog.innerHTML = '<li style="color: #94a3b8; justify-content: center;">No scans recorded yet</li>';
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>
</body>
</html>
